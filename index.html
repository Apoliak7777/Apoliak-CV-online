<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfólio</title>
  <meta name="description" content="">
  <meta name="theme-color" content="#0a0b0d">
  <meta property="og:type" content="profile">
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <meta property="og:image" content="" id="og-image">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="" id="og-url">
  <meta property="og:locale" content="sk_SK">
  <meta property="og:locale:alternate" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="" id="tw-image">
  <link rel="canonical" href="" id="canonical">

  <!-- favicon: monogram sa dosadí z content.js za behu -->
  <link id="favicon" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0b0d'/%3E%3Ctext x='32' y='44' font-family='monospace' font-size='34' font-weight='700' fill='%23d6ff4b' text-anchor='middle'%3EAP%3C/text%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- fonty načítavame NEblokujúco (media="print" → po načítaní sa prepne na all):
       stránka sa vykreslí okamžite so systémovým fontom aj bez internetu / pri pomalej sieti -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"></noscript>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#app">Preskočiť na obsah / Skip to content</a>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <button type="button" class="fab-top" id="fab-top" aria-label="Späť hore / Back to top" title="Späť hore / Back to top">&#8593;</button>

  <div class="lang" role="group" aria-label="Jazyk / Language">
    <button id="btn-sk" class="active" onclick="setLang('sk')">SK</button>
    <button id="btn-en" onclick="setLang('en')">EN</button>
  </div>

  <main class="wrap" id="app">
    <!-- obsah sa vygeneruje z content.js; toto je viditeľný stav pred/bez JS -->
    <noscript><div style="padding:80px 0;color:#f4f5f7;font:16px/1.6 sans-serif">Táto stránka potrebuje zapnutý JavaScript. / This page requires JavaScript.</div></noscript>
    <div id="boot" style="padding:80px 0;color:#a7abb5;font:16px/1.6 sans-serif">Načítavam CV… / Loading…</div>
  </main>

  <!-- DÁTA -->
  <script src="content.js"></script>
  <script>
    // V náhľade z admina (index.html?preview=1) sa použije rozpracovaný koncept
    (function () {
      try {
        var preview = new URLSearchParams(location.search).get('preview');
        if (preview === '1') {
          var draft = localStorage.getItem('cv_admin_draft');
          if (draft) window.CV_DATA = JSON.parse(draft);
        }
      } catch (e) {}
    })();

    var D = window.CV_DATA;
    var lang = 'sk';
    var CERT_PREVIEW = 5;
    var toastTimer;
    var spyIO;
    var statsIO;

    // pomocníci
    function t(v, l) {
      if (v && typeof v === 'object' && !Array.isArray(v)) return v[l] != null ? v[l] : (v.sk != null ? v.sk : (v.en != null ? v.en : ''));
      return v != null ? v : '';
    }
    function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
    function safeUrl(u) {
      u = String(u || '').trim();
      if (/^\s*javascript:/i.test(u)) return '#';
      return u;
    }
    function isExternal(u) { return /^https?:\/\//i.test(u); }
    function initials(name) {
      var p = String(name || '').trim().split(/\s+/);
      return (((p[0] || '')[0] || '') + ((p[1] || '')[0] || '')).toUpperCase() || 'CV';
    }
    // slovenské skloňovanie počtu certifikátov: 1 = certifikát, 2–4 = certifikáty, 5+ = certifikátov
    function plCert(n, l) {
      if (l === 'sk') return n === 1 ? 'certifikát' : (n >= 2 && n <= 4 ? 'certifikáty' : 'certifikátov');
      return n === 1 ? 'certificate' : 'certificates';
    }

    /* Rozsah dátumov skupiny certifikátov.
       Zo zoznamu textov ako "Máj 2026" / "Október – November 2025" / "December 2025 – Január 2026"
       zloží jeden úhľadný rozsah ("Október 2025 – Január 2026"). Mesiac bez roka preberá
       najbližší rok napravo. Ak sa nič nerozparsuje, vráti prvý text nezmenený. */
    var MONTHS = {
      sk: ['Január','Február','Marec','Apríl','Máj','Jún','Júl','August','September','Október','November','December'],
      en: ['January','February','March','April','May','June','July','August','September','October','November','December']
    };
    function certRange(whens, l) {
      var names = MONTHS[l] || MONTHS.sk;
      var pts = [];
      whens.forEach(function (w) {
        var toks = [], re = /(\d{4})|([\p{L}]+)/gu, mm;
        while ((mm = re.exec(w)) !== null) {
          if (mm[1]) { toks.push({ year: parseInt(mm[1], 10) }); continue; }
          var word = mm[2].toLowerCase();
          ['sk', 'en'].forEach(function (k) {
            var i = MONTHS[k].findIndex(function (n) { return n.toLowerCase() === word; });
            if (i >= 0 && !toks.some(function (x) { return x.pending && x.month === i; })) toks.push({ pending: true, month: i });
          });
        }
        // mesiacu priradíme najbližší rok napravo, inak posledný rok v reťazci
        var lastYear = null;
        toks.forEach(function (x) { if (x.year != null) lastYear = x.year; });
        for (var i = 0; i < toks.length; i++) {
          if (!toks[i].pending) continue;
          var y = null;
          for (var j = i + 1; j < toks.length; j++) { if (toks[j].year != null) { y = toks[j].year; break; } }
          if (y == null) y = lastYear;
          if (y != null) pts.push(y * 12 + toks[i].month);
        }
      });
      if (!pts.length) return whens[0] || '';
      var lo = Math.min.apply(null, pts), hi = Math.max.apply(null, pts);
      function fmt(v) { return names[v % 12] + ' ' + Math.floor(v / 12); }
      return lo === hi ? fmt(lo) : fmt(lo) + ' – ' + fmt(hi);
    }
    function getSiteUrl() {
      var manual = String((D.meta || {}).siteUrl || '').trim().replace(/\/+$/, '');
      if (manual) return manual;
      if (location.protocol === 'http:' || location.protocol === 'https:') return location.origin;
      return '';
    }
    function absUrl(path) {
      var base = getSiteUrl();
      if (!base || !path) return '';
      return base + '/' + String(path).replace(/^\/+/, '');
    }
    function showToast(msg) {
      var el = document.getElementById('toast');
      if (!el) return;
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2200);
    }
    function updateSeo(m, descTxt) {
      var site = getSiteUrl();
      var og = absUrl(m.ogImage || 'og-image.svg');
      setMeta('meta[property="og:title"]', t(m.title, lang) || m.name, 'content');
      setMeta('meta[property="og:description"]', descTxt, 'content');
      setMeta('meta[name="twitter:image"]', og, 'content', 'tw-image');
      setMeta('meta[property="og:image"]', og, 'content', 'og-image');
      setMeta('meta[property="og:url"]', site, 'content', 'og-url');
      setMeta('link#canonical', site, 'href', 'canonical');
      updateHreflang(site);
      var old = document.getElementById('ld-person');
      if (old) old.remove();
      var links = (D.links || []).map(function (lk) { return safeUrl(lk.url); }).filter(isExternal);
      var script = document.createElement('script');
      script.id = 'ld-person';
      script.type = 'application/ld+json';
      script.textContent = JSON.stringify({
        '@context': 'https://schema.org',
        '@type': 'Person',
        name: m.name || '',
        jobTitle: t((D.hero || {}).role, lang),
        description: descTxt,
        email: (D.footer || {}).email || undefined,
        url: site || undefined,
        image: og || undefined,
        birthDate: m.birthISO || undefined,
        telephone: (D.links || []).reduce(function (acc, lk) { return acc || (/^tel:/i.test(String(lk.url || '')) ? String(lk.url).replace(/^tel:/i, '') : ''); }, '') || undefined,
        address: t(m.location, lang) ? { '@type': 'PostalAddress', addressLocality: m.locality || t(m.location, lang), addressCountry: 'SK' } : undefined,
        sameAs: links.length ? links : undefined
      });
      document.head.appendChild(script);
    }
    function updateHreflang(site) {
      ['hreflang-sk', 'hreflang-en', 'hreflang-x'].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) el.remove();
      });
      if (!site) return;
      [['sk', 'hreflang-sk'], ['en', 'hreflang-en'], ['x-default', 'hreflang-x']].forEach(function (pair) {
        var link = document.createElement('link');
        link.id = pair[1];
        link.rel = 'alternate';
        link.hreflang = pair[0];
        link.href = site + (location.search || '');
        document.head.appendChild(link);
      });
    }

    function render() {
      var m = D.meta || {};
      // farby + metadáta
      var root = document.documentElement.style;
      if (m.accent)  root.setProperty('--accent', m.accent);
      if (m.accent2) root.setProperty('--accent-2', m.accent2);
      if (m.accent3) root.setProperty('--accent-3', m.accent3);
      var tc = document.querySelector('meta[name="theme-color"]'); if (tc) tc.setAttribute('content', getComputedStyle(document.body).backgroundColor || '#0a0b0d');
      document.title = t(m.title, lang) || (m.name || 'Portfólio');
      var descTxt = t(m.description, lang);
      setMeta('meta[name="description"]', descTxt);
      updateSeo(m, descTxt);

      var h = D.hero || {};
      var name = esc(m.name || 'Tvoje meno');
      // meno rozdelíme na riadky podľa medzier (max 2 riadky pôsobia najlepšie)
      var parts = (m.name || 'Tvoje meno').trim().split(/\s+/);
      var nameHtml;
      if (parts.length >= 2) {
        var mid = Math.ceil(parts.length / 2);
        nameHtml = esc(parts.slice(0, mid).join(' ')) + '<br>' + esc(parts.slice(mid).join(' '));
      } else { nameHtml = name; }

      // favicon z monogramu
      updateFavicon(initials(m.name), (m.accent || '#d6ff4b'));

      var html = '';
      html += '<header class="hero">';
      html += '<div class="hero-top">';
      if (m.photo) {
        html += '<img class="avatar rise d1" src="' + esc(safeUrl(m.photo)) + '" alt="' + name + '">';
      } else {
        html += '<div class="monogram rise d1" aria-hidden="true">' + esc(initials(m.name)) + '</div>';
      }
      html += '<div class="status rise d1"><span class="dot ' + (h.available ? 'on' : '') + '"></span>'
            + '<span class="mono">&gt; ' + esc(t(h.status, lang)) + '</span></div>';
      if (t(m.location, lang)) html += '<span class="status rise d1" style="color:var(--text-dim)"><span class="mono">' + esc(t(m.location, lang)) + '</span></span>';
      if (t(m.birth, lang)) html += '<span class="status rise d1" style="color:var(--text-dim)"><span class="mono">'
            + (lang === 'sk' ? 'nar. ' : 'b. ') + esc(t(m.birth, lang)) + '</span></span>';
      html += '</div>';

      html += '<h1 class="rise d2">' + nameHtml + '<span class="accent">.</span></h1>';
      if (t(h.role, lang)) html += '<div class="role rise d3">// ' + esc(t(h.role, lang)) + '</div>';
      if (t(h.bio, lang))  html += '<p class="bio rise d3">' + esc(t(h.bio, lang)) + '</p>';

      // odkazy
      var links = D.links || [];
      html += '<nav class="links rise d4">';
      links.forEach(function (lk) {
        var label = esc(t(lk.label, lang));
        var url = safeUrl(lk.url);
        var ext = isExternal(url) ? ' target="_blank" rel="noopener"' : '';
        var arrow = isExternal(url) ? ' &#8599;' : '';
        html += '<a href="' + esc(url) + '"' + ext + '>' + label + arrow + '</a>';
      });
      if (m.cvFile && !/tvoje-domena/.test(m.cvFile)) {
        html += '<a class="cv" href="' + esc(safeUrl(m.cvFile)) + '" target="_blank" rel="noopener">'
              + (lang === 'sk' ? 'Stiahnuť CV (PDF)' : 'Download CV (PDF)') + ' &#8595;</a>';
      } else {
        // bez nahratého PDF vytlačíme túto stránku — print štýl z nej spraví hotový dokument
        html += '<button type="button" class="cv print-cv">'
              + (lang === 'sk' ? 'Stiahnuť CV (PDF)' : 'Download CV (PDF)') + ' &#8595;</button>';
      }
      html += '</nav>';

      // highlights / štatistiky z dát
      html += renderStats();

      html += renderJumpNav();

      html += '</header>';

      // sekcie podľa poradia
      var sec = D.sections || {};
      var order = (sec.order || ['experience', 'projects', 'skills', 'education', 'certificates', 'interests']);
      var num = 0;
      order.forEach(function (key) {
        var cfg = sec[key];
        if (!cfg || cfg.show === false) return;
        var items = D[key] || [];
        if (!items.length) return;
        num++;
        var n = (num < 10 ? '0' : '') + num;
        html += '<section class="reveal" id="section-' + esc(key) + '"><div class="sec-head"><span class="sec-num">' + n + '</span>'
              + '<span class="sec-title">' + esc(t(cfg.label, lang)) + '</span>'
              + '<span class="sec-count">' + items.length + '</span></div>';
        html += renderSection(key, items);
        // voliteľný odkaz pod sekciou (napr. "Pozrieť všetky projekty")
        if (cfg.more && cfg.more.url) {
          html += '<a class="all-projects" href="' + esc(safeUrl(cfg.more.url)) + '">'
                + esc(t(cfg.more.label, lang))
                + (cfg.more.count ? '<span class="n">' + esc(String(cfg.more.count)) + '</span>' : '')
                + ' &#8594;</a>';
        }
        html += '</section>';
      });

      // pätička
      var f = D.footer || {};
      html += '<footer class="reveal"><span>&copy; ' + new Date().getFullYear() + ' ' + name + '</span>';
      html += '<span style="display:inline-flex;gap:18px;align-items:center">';
      if (f.email) html += '<a href="mailto:' + esc(f.email) + '" class="copy-email" data-email="' + esc(f.email) + '">' + esc(f.email) + '</a>';
      html += '<button class="to-top" onclick="window.scrollTo({top:0,behavior:\'smooth\'})">' + (lang === 'sk' ? 'hore' : 'top') + ' &#8593;</button>';
      html += '</span></footer>';

      document.getElementById('app').innerHTML = html;

      // jazyk tlačidlá + html lang
      document.documentElement.lang = lang;
      document.getElementById('btn-sk').classList.toggle('active', lang === 'sk');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');

      observeReveals();
      observeScrollSpy();
      observeStats();
      bindInteractions();
    }

    function setMeta(sel, val, attr, id) {
      var el = id ? document.getElementById(id) : document.querySelector(sel);
      if (el) el.setAttribute(attr || 'content', val || '');
    }

    function renderJumpNav() {
      var sec = D.sections || {};
      var order = (sec.order || ['experience', 'projects', 'skills', 'education', 'certificates', 'interests']);
      var items = [];
      order.forEach(function (key) {
        var cfg = sec[key];
        if (!cfg || cfg.show === false) return;
        var data = D[key] || [];
        if (!data.length) return;
        items.push('<a href="#section-' + esc(key) + '" data-section="' + esc(key) + '">' + esc(t(cfg.label, lang)) + '</a>');
      });
      if (items.length < 2) return '';
      return '<nav class="jump-nav rise d5" aria-label="' + (lang === 'sk' ? 'Sekcie' : 'Sections') + '">' + items.join('') + '</nav>';
    }

    function renderStats() {
      var cells = [];
      var exp = (D.experience || []).length;
      // na hlavnej je len výber projektov — počítadlo hlási skutočný počet
      // z podstránky (sections.projects.more.count), ak je nastavený
      var projMore = ((D.sections || {}).projects || {}).more || {};
      var proj = projMore.count || (D.projects || []).length;
      var certs = (D.certificates || []).length;
      if (exp)  cells.push({ n: exp, label: lang === 'sk' ? 'Pracovné skúsenosti' : 'Work experiences' });
      if (certs) cells.push({ n: certs, plus: true, label: lang === 'sk' ? 'Certifikátov' : 'Certificates' });
      if (proj) cells.push({ n: proj, label: lang === 'sk' ? 'Projekty' : 'Projects' });
      if (cells.length < 2) return '';
      var s = '<div class="stats rise d5">';
      cells.forEach(function (c) {
        s += '<div class="stat"><div class="stat-num" data-target="' + c.n + '"><span class="stat-val">0</span>' + (c.plus ? '<span class="plus">+</span>' : '') + '</div>'
           + '<div class="stat-label">' + esc(c.label) + '</div></div>';
      });
      return s + '</div>';
    }

    function renderSection(key, items) {
      if (key === 'experience') {
        var s = '<div class="timeline">';
        items.forEach(function (j) {
          var cur = j.current ? ' is-current' : '';
          var now = j.current ? '<span class="exp-now">' + (lang === 'sk' ? 'teraz' : 'now') + '</span>' : '';
          s += '<article class="exp' + cur + '"><div class="exp-mark"></div><div>'
             + '<div class="exp-when">' + esc(t(j.when, lang)) + now + '</div>'
             + '<div class="exp-title">' + esc(t(j.title, lang)) + '</div>'
             + '<div class="exp-company">' + esc(t(j.company, lang)) + '</div>'
             + '<p class="exp-desc">' + esc(t(j.desc, lang)) + '</p>'
             + '</div></article>';
        });
        return s + '</div>';
      }
      if (key === 'projects') {
        var s = '<div class="grid">';
        items.forEach(function (p) {
          var url = safeUrl(p.url);
          var ext = isExternal(url) ? ' target="_blank" rel="noopener"' : '';
          var tags = (p.tags || []).map(function (x) { return '<span>' + esc(x) + '</span>'; }).join('');
          var tag = url ? 'a' : 'div';
          var href = url ? ' href="' + esc(url) + '"' + ext : '';
          var feat = p.featured ? ' featured' : '';
          var badge = p.featured ? '<span class="project-badge">' + (lang === 'sk' ? 'Hlavný' : 'Featured') + '</span>' : '';
          s += '<' + tag + ' class="project' + feat + '"' + href + '>'
             + '<div class="project-head"><span class="project-title">' + esc(t(p.title, lang)) + '</span>'
             + ((badge || url) ? '<span class="project-head-right">' + badge + (url ? '<span class="project-arrow">&#8599;</span>' : '') + '</span>' : '') + '</div>'
             + '<p class="project-desc">' + esc(t(p.desc, lang)) + '</p>'
             + (tags ? '<div class="project-tags">' + tags + '</div>' : '')
             + '</' + tag + '>';
        });
        return s + '</div>';
      }
      if (key === 'skills') {
        var s = '<div class="skill-rows">';
        items.forEach(function (sk) {
          s += '<div class="skill"><span class="skill-name">' + esc(t(sk.name, lang)) + '</span>'
             + '<span class="skill-detail">' + esc(t(sk.detail, lang)) + '</span></div>';
        });
        return s + '</div>';
      }
      if (key === 'interests') {
        var s = '<div class="interest-grid">';
        items.forEach(function (it) {
          s += '<div class="interest"><div class="interest-name">' + esc(t(it.name, lang)) + '</div>'
             + (t(it.detail, lang) ? '<div class="interest-detail">' + esc(t(it.detail, lang)) + '</div>' : '')
             + '</div>';
        });
        return s + '</div>';
      }
      if (key === 'education') {
        var s = '<div class="edu-list">';
        items.forEach(function (e) {
          var cur = e.current ? ' is-current' : '';
          var now = e.current ? (lang === 'sk' ? 'študujem' : 'studying') : '';
          s += '<article class="edu' + cur + '">'
             + '<div class="edu-when">' + esc(t(e.when, lang)) + '</div>'
             + '<div class="edu-title"' + (now ? ' data-now="' + esc(now) + '"' : '') + '>' + esc(t(e.title, lang)) + '</div>'
             + '<div class="edu-place">' + esc(t(e.place, lang)) + '</div>'
             + (t(e.desc, lang) ? '<p class="edu-desc">' + esc(t(e.desc, lang)) + '</p>' : '')
             + '</article>';
        });
        return s + '</div>';
      }
      if (key === 'certificates') {
        // zoskupenie podľa vydavateľa, poradie = prvý výskyt
        var groups = [], byIssuer = {};
        items.forEach(function (c) {
          var iss = t(c.issuer, lang) || (lang === 'sk' ? 'Ostatné' : 'Other');
          if (!byIssuer[iss]) { byIssuer[iss] = { issuer: iss, whens: {}, items: [] }; groups.push(byIssuer[iss]); }
          byIssuer[iss].items.push(c);
          var w = t(c.when, lang); if (w) byIssuer[iss].whens[w] = true;
        });
        var palette = ['var(--accent-2)', 'var(--accent-3)', 'var(--accent)'];
        var s = '';
        groups.forEach(function (g, gi) {
          var col = palette[gi % palette.length];
          var whens = Object.keys(g.whens);
          var whenTxt = whens.length ? certRange(whens, lang) : '';
          var word = plCert(g.items.length, lang);
          s += '<div class="cert-group" style="--cg:' + col + '">'
             + '<div class="cert-group-head">'
             + '<span class="cert-issuer-dot"></span>'
             + '<span class="cert-issuer">' + esc(g.issuer) + '</span>'
             + '<span class="cert-badge">' + g.items.length + ' ' + word + '</span>'
             + (whenTxt ? '<span class="cert-when">' + esc(whenTxt) + '</span>' : '')
             + '</div><div class="cert-chips">';
          g.items.forEach(function (c, ci) {
            var hidden = ci >= CERT_PREVIEW ? ' is-hidden' : '';
            var curl = safeUrl(c.url);
            var chipTag = curl ? 'a' : 'div';
            var chipHref = curl ? ' href="' + esc(curl) + '" target="_blank" rel="noopener"' : '';
            s += '<' + chipTag + ' class="cert-chip' + hidden + '"' + chipHref + '><span class="cert-tick">&#10003;</span>'
               + '<span class="cert-name">' + esc(t(c.title, lang)) + (curl ? ' &#8599;' : '') + '</span></' + chipTag + '>';
          });
          if (g.items.length > CERT_PREVIEW) {
            var more = g.items.length - CERT_PREVIEW;
            s += '<button type="button" class="cert-more" data-more="' + more + '">'
               + (lang === 'sk' ? 'Zobraziť ďalších ' + more : 'Show ' + more + ' more') + '</button>';
          }
          s += '</div></div>';
        });
        return s;
      }
      return '';
    }

    // favicon z monogramu + zvolenej farby
    function updateFavicon(init, accent) {
      try {
        var link = document.getElementById('favicon');
        if (!link) return;
        var svg = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'>"
                + "<rect width='64' height='64' rx='14' fill='#0a0b0d'/>"
                + "<text x='32' y='45' font-family='monospace' font-size='32' font-weight='700' fill='" + accent + "' text-anchor='middle'>" + init + "</text></svg>";
        link.setAttribute('href', 'data:image/svg+xml,' + encodeURIComponent(svg));
      } catch (e) {}
    }

    var io;
    function observeReveals() {
      // poistka: bez IntersectionObserver zobraz sekcie rovno (nikdy nesmú zostať skryté)
      if (!window.IntersectionObserver) {
        document.querySelectorAll('.reveal').forEach(function (el) { el.classList.add('in'); });
        return;
      }
      if (io) io.disconnect();
      io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
      }, { threshold: 0.12 });
      document.querySelectorAll('.reveal').forEach(function (el) {
        // položkám v sekcii dáme poradie, aby po odhalení prilietali jedna po druhej
        var kids = el.querySelectorAll('.exp, .project, .skill, .edu, .cert-group, .interest');
        Array.prototype.forEach.call(kids, function (k, i) {
          k.classList.add('r-item');
          k.style.setProperty('--i', i);
        });
        io.observe(el);
      });
    }

    function observeScrollSpy() {
      if (spyIO) spyIO.disconnect();
      var links = document.querySelectorAll('.jump-nav a[data-section]');
      if (!links.length || !window.IntersectionObserver) return;
      var map = {};
      links.forEach(function (a) { map[a.getAttribute('data-section')] = a; });
      var visible = {};
      spyIO = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) { visible[e.target.id] = e.isIntersecting; });
        var activeId = null;
        document.querySelectorAll('section[id^="section-"]').forEach(function (sec) {
          if (visible[sec.id]) activeId = sec.id;
        });
        links.forEach(function (a) { a.classList.remove('is-active'); });
        if (activeId) {
          var key = activeId.replace('section-', '');
          if (map[key]) map[key].classList.add('is-active');
        }
      }, { rootMargin: '-42% 0px -48% 0px', threshold: 0 });
      document.querySelectorAll('section[id^="section-"]').forEach(function (s) { spyIO.observe(s); });
    }

    function observeStats() {
      if (statsIO) statsIO.disconnect();
      var box = document.querySelector('.stats');
      if (!box || !window.IntersectionObserver) {
        document.querySelectorAll('.stat-val').forEach(function (el) {
          var n = el.parentElement && el.parentElement.getAttribute('data-target');
          if (n) el.textContent = n;
        });
        return;
      }
      statsIO = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (!e.isIntersecting) return;
          statsIO.unobserve(e.target);
          if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            e.target.querySelectorAll('.stat-val').forEach(function (el) {
              el.textContent = el.parentElement.getAttribute('data-target') || '0';
            });
            return;
          }
          e.target.querySelectorAll('.stat-num').forEach(function (num) {
            var target = parseInt(num.getAttribute('data-target') || '0', 10);
            var val = num.querySelector('.stat-val');
            if (!val || !target) return;
            var t0 = performance.now();
            function tick(now) {
              var p = Math.min(1, (now - t0) / 700);
              val.textContent = String(Math.round(target * (1 - Math.pow(1 - p, 3))));
              if (p < 1) requestAnimationFrame(tick);
            }
            requestAnimationFrame(tick);
          });
        });
      }, { threshold: 0.35 });
      statsIO.observe(box);
    }

    // plávajúce tlačidlo hore
    function onScroll() {
      var st = document.documentElement.scrollTop || document.body.scrollTop;
      var fab = document.getElementById('fab-top');
      if (fab) fab.classList.toggle('show', st > 420);
    }
    window.addEventListener('scroll', onScroll, { passive: true });

    function bindInteractions() {
      document.querySelectorAll('.cert-more').forEach(function (btn) {
        btn.onclick = function () {
          var group = btn.closest('.cert-group');
          if (!group) return;
          var expanded = group.classList.toggle('is-expanded');
          var more = btn.getAttribute('data-more') || '';
          btn.textContent = expanded
            ? (lang === 'sk' ? 'Zobraziť menej' : 'Show less')
            : (lang === 'sk' ? 'Zobraziť ďalších ' + more : 'Show ' + more + ' more');
        };
      });
      var fab = document.getElementById('fab-top');
      if (fab) fab.onclick = function () { window.scrollTo({ top: 0, behavior: 'smooth' }); };

      // "Stiahnuť CV (PDF)" bez nahratého súboru = tlač stránky do PDF
      document.querySelectorAll('.print-cv').forEach(function (btn) {
        btn.onclick = function () {
          showToast(lang === 'sk' ? 'Vyber „Uložiť ako PDF"' : 'Choose "Save as PDF"');
          setTimeout(function () { window.print(); }, 250);
        };
      });

      document.querySelectorAll('.copy-email').forEach(function (el) {
        el.onclick = function (e) {
          var email = el.getAttribute('data-email') || '';
          if (!email) return;
          e.preventDefault();
          var done = function () {
            showToast(lang === 'sk' ? 'E-mail skopírovaný' : 'Email copied');
          };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(email).then(done).catch(function () { window.location.href = 'mailto:' + email; });
          } else {
            window.location.href = 'mailto:' + email;
          }
        };
      });
    }

    function setLang(l) {
      lang = l;
      try { localStorage.setItem('lang', l); sessionStorage.setItem('lang', l); } catch (e) {}
      render();
      onScroll();
    }

    document.addEventListener('keydown', function (e) {
      if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      if (e.key === 'e' || e.key === 'E') setLang('en');
      if (e.key === 's' || e.key === 'S') setLang('sk');
    });

    // štart
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('lang') || sessionStorage.getItem('lang'); } catch (e) {}
      if (saved === 'en' || saved === 'sk') lang = saved;
      // záchytka: akákoľvek chyba pri štarte sa zobrazí na stránke, nikdy nie čierna obrazovka
      try {
        if (!window.CV_DATA) throw new Error('content.js sa nenačítal — musí byť v rovnakom priečinku ako index.html');
        render();
      } catch (err) {
        document.getElementById('app').innerHTML =
          '<div style="padding:80px 0;color:#f4f5f7;font:16px/1.6 sans-serif">'
          + '<strong style="color:#ff9d54">Obsah sa nepodarilo načítať.</strong><br><br>'
          + '<code style="color:#a7abb5;font-size:14px">' + esc(String(err && err.message ? err.message : err)) + '</code></div>';
        return;
      }
      onScroll();
      // nábehové animácie spustíme hneď po prvom vykreslení — nečakáme na 'load'
      // (pomalé Google Fonts by inak držali stránku neviditeľnú)
      function markLoaded() { document.body.classList.add('loaded'); }
      if (window.requestAnimationFrame) {
        requestAnimationFrame(function () { requestAnimationFrame(markLoaded); });
      } else {
        markLoaded();
      }
      // poistka pre každý prípad
      setTimeout(markLoaded, 400);
      // núdzová poistka: ak je po 1.4 s niečo vo viewporte stále neviditeľné
      // (zaseknuté animácie, starý prehliadač...), zobraz všetko natvrdo
      setTimeout(function () {
        var stuck = false;
        // kontrolujeme aj položky vnútri sekcií (.r-item) — sekcia môže byť
        // odhalená, ale jej obsah zaseknutý na opacity 0
        document.querySelectorAll('.rise, .reveal, .r-item').forEach(function (el) {
          var r = el.getBoundingClientRect();
          var inView = r.top < window.innerHeight && r.bottom > 0;
          if (inView && getComputedStyle(el).opacity === '0') stuck = true;
        });
        if (stuck) document.body.classList.add('force');
      }, 1400);
    })();
  </script>
</body>
</html>
